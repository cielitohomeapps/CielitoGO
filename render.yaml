services:
  - type: web
    runtime: node
    name: cielitogo-api
    rootDir: CielitoGoBackend
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: cielito-go
      - key: ALLOW_EPHEMERAL_UPLOADS
        value: "false"
      - key: JWT_EXPIRATION
        value: 24h
      - key: JWT_ISSUER
        value: cielito-go-api
      - key: JWT_AUDIENCE
        value: cielito-go-admin

  - type: web
    runtime: node
    name: cielitogo-web
    rootDir: CielitoGoFrontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: TRUST_BACKEND_PUBLIC_SETTINGS
        value: "false"
      - key: NEXT_PUBLIC_PRIVACY_NOTICE_VERSION
        value: "2026-11-24"

  - type: cron
    runtime: node
    name: cielitogo-data-retention
    rootDir: CielitoGoBackend
    schedule: "0 4 1 * *"
    buildCommand: npm ci
    startCommand: npm run retention -- --execute
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_RETENTION_DAYS
        value: "730"
